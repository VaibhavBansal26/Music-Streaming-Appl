services:
  admin-service:
    build: ./adminService
    image: vaibhavbansal26/music-streaming-appl-admin:${TAG:-latest}
    env_file:
      - ./adminService/.env
    ports:
      - "5002:5002"
    networks:
      - app-network

  song-service:
    build: ./songService
    image: vaibhavbansal26/music-streaming-appl-song:${TAG:-latest}
    env_file:
      - ./songService/.env
    ports:
      - "5003:5003"
    networks:
      - app-network

  user-service:
    build: ./userService
    image: vaibhavbansal26/music-streaming-appl-user:${TAG:-latest}
    env_file:
      - ./userService/.env
    ports:
      - "5001:5001"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    image: vaibhavbansal26/music-streaming-appl-frontend:${TAG:-latest}
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
