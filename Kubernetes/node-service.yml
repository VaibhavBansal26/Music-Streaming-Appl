---
# Expose admin service externally via NodePort
apiVersion: v1
kind: Service
metadata:
  name: music-streaming-appl-admin-node
  labels:
    app: music-streaming-appl-admin
spec:
  type: NodePort
  selector:
    app: music-streaming-appl-admin
  ports:
  - protocol: TCP
    port: 5002
    targetPort: 5002
    nodePort: 30002
---
# Expose song service externally via NodePort
apiVersion: v1
kind: Service
metadata:
  name: music-streaming-appl-song-node
  labels:
    app: music-streaming-appl-song
spec:
  type: NodePort
  selector:
    app: music-streaming-appl-song
  ports:
  - protocol: TCP
    port: 5003
    targetPort: 5003
    nodePort: 30003
---
# Expose user service externally via NodePort
apiVersion: v1
kind: Service
metadata:
  name: music-streaming-appl-user-node
  labels:
    app: music-streaming-appl-user
spec:
  type: NodePort
  selector:
    app: music-streaming-appl-user
  ports:
  - protocol: TCP
    port: 5001
    targetPort: 5001
    nodePort: 30004
---
# Expose frontend externally via NodePort
apiVersion: v1
kind: Service
metadata:
  name: music-streaming-appl-frontend-node
  labels:
    app: music-streaming-appl-frontend
spec:
  type: NodePort
  selector:
    app: music-streaming-appl-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30001
