---
apiVersion: v1
kind: Service
metadata:
  name: music-streaming-appl-admin-ext
  labels:
    app: music-streaming-appl-admin
spec:
  type: LoadBalancer
  selector:
    app: music-streaming-appl-admin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: music-streaming-appl-song-ext
  labels:
    app: music-streaming-appl-song
spec:
  type: LoadBalancer
  selector:
    app: music-streaming-appl-song
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5003
---
apiVersion: v1
kind: Service
metadata:
  name: music-streaming-appl-user-ext
  labels:
    app: music-streaming-appl-user
spec:
  type: LoadBalancer
  selector:
    app: music-streaming-appl-user
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: music-streaming-appl-frontend-node
  labels:
    app: music-streaming-appl-frontend
spec:
  type: NodePort
  selector:
    app: music-streaming-appl-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30001
