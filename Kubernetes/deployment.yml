apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-streaming-appl-admin
  labels:
    app: music-streaming-appl-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: music-streaming-appl-admin
  template:
    metadata:
      labels:
        app: music-streaming-appl-admin
    spec:
      containers:
      - name: admin-service
        image: vaibhavbansal26/music-streaming-appl-admin:IMAGE_TAG
        ports:
        - containerPort: 5002
        envFrom:
        - secretRef:
            name: admin-env
        readinessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 384Mi

