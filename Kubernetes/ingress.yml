apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music-streaming-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - http:
      paths:
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: music-streaming-appl-admin-svc
            port:
              number: 5002
      - path: /song
        pathType: Prefix
        backend:
          service:
            name: music-streaming-appl-song-svc
            port:
              number: 5003
      - path: /user
        pathType: Prefix
        backend:
          service:
            name: music-streaming-appl-user-svc
            port:
              number: 5001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: music-streaming-appl-frontend-svc
            port:
              number: 80
